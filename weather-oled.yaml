esphome:
  name: weather-oled
  friendly_name: Weather OLED

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
    version: recommended

logger:

api:
  encryption:
    key: !secret weather_display_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Weather-Display-Fallback"
    password: !secret fallback_password

captive_portal:

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  id: spi_bus

display:
  - platform: ili9xxx
    model: ILI9341
    cs_pin: GPIO22
    dc_pin: GPIO1
    reset_pin: GPIO17
    color_palette: 8BIT
    color_order: BGR
    rotation: 270
    invert_colors: false
    data_rate: 20MHz
    # Removed spi_mode: MODE3 — ILI9341 uses MODE0 (the default).
    # MODE3 was preventing SPI communication, causing the blank screen.
    show_test_card: true
    spi_id: spi_bus
    dimensions:
      width: 240
      height: 320
    lambda: |-
      // Draw a black background so content is visible
      it.fill(Color(0, 0, 0));
      // Simple test text in white
      it.printf(10, 10, id(default_font), Color(255, 255, 255), "Weather OLED");
      it.printf(10, 40, id(default_font), Color(0, 255, 0), "Display OK!");

font:
  - file: "gfonts://Roboto"
    id: default_font
    size: 20
