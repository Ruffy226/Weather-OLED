esphome:
  name: weather-oled
  friendly_name: Weather OLED

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret weather_display_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Weather-Display-Fallback"
    password: !secret fallback_password

captive_portal:

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  id: spi_bus

display:
  - platform: ili9xxx
    model: ILI9341
    cs_pin: GPIO21
    dc_pin: GPIO1
    reset_pin: GPIO2
    data_rate: 4MHz
    show_test_card: true
    spi_id: spi_bus
