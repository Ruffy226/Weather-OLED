esphome:
  name: weather-eink
  friendly_name: Weather E-Ink

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret weather_display_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Weather-EInk-Fallback"
    password: !secret fallback_password

captive_portal:

# SPI bus for Waveshare 7.5" V2 e-paper display (800x480)
# Wiring:
#   Display VCC  -> 3.3V
#   Display GND  -> GND
#   Display CLK  -> GPIO18
#   Display DIN  -> GPIO23  (MOSI)
#   Display CS   -> GPIO5
#   Display DC   -> GPIO17
#   Display RST  -> GPIO16
#   Display BUSY -> GPIO4
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  id: spi_bus

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_xl
    size: 64
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 11
  - file: "gfonts://Roboto"
    id: font_tiny_mid
    size: 14
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
  # MDI weather icons — only the glyphs we actually use are compiled in
  - file: "materialdesignicons-webfont.ttf"
    id: font_icons
    size: 48
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0598"  # weather-snowy
      - "\U000F0597"  # weather-pouring
      - "\U000F0596"  # weather-rainy
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0594"  # weather-night
      - "\U000F0593"  # weather-lightning
      - "\U000F0592"  # weather-hail
      - "\U000F0591"  # weather-fog
      - "\U000F0590"  # weather-cloudy
      - "\U000F059D"  # weather-windy
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0F35"  # weather-snowy-rainy
  - file: "materialdesignicons-webfont.ttf"
    id: font_icons_sm
    size: 28
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0598"  # weather-snowy
      - "\U000F0597"  # weather-pouring
      - "\U000F0596"  # weather-rainy
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0594"  # weather-night
      - "\U000F0593"  # weather-lightning
      - "\U000F0592"  # weather-hail
      - "\U000F0591"  # weather-fog
      - "\U000F0590"  # weather-cloudy
      - "\U000F059D"  # weather-windy
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0F35"  # weather-snowy-rainy

# ── Sensors from Home Assistant ───────────────────────────────────────────────
text_sensor:
  - platform: version
    name: "ESPHome Version"
    internal: true
  # ── Current conditions ───────────────────────────────────────────────────
  - platform: homeassistant
    id: weather_temp
    entity_id: sensor.kianevad37_temperature
    internal: true
  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.kianevad37_relative_humidity
    internal: true
  - platform: homeassistant
    id: weather_wind_speed
    entity_id: sensor.kianevad37_wind_speed
    internal: true
  - platform: homeassistant
    id: weather_wind_dir
    entity_id: sensor.kianevad37_wind_direction_cardinal
    internal: true
  - platform: homeassistant
    id: weather_summary_current
    entity_id: sensor.kianevad37_weather_summary_0
    internal: true
  # ── Bottom ribbon sensors ────────────────────────────────────────────────
  - platform: homeassistant
    id: sunrise_time
    entity_id: sensor.sun_next_dawn
    internal: true
  - platform: homeassistant
    id: sunset_time
    entity_id: sensor.sun_next_dusk
    internal: true
  - platform: homeassistant
    id: pressure
    entity_id: sensor.kianevad37_pressure
    internal: true
  # ── 5-day forecast summaries (_0=today _1=day2 _2=day3 _3=day4 _4=day5) ──
  - platform: homeassistant
    id: summary_0
    entity_id: sensor.kianevad37_weather_summary_0
    internal: true
  - platform: homeassistant
    id: summary_1
    entity_id: sensor.kianevad37_weather_summary_1
    internal: true
  - platform: homeassistant
    id: summary_2
    entity_id: sensor.kianevad37_weather_summary_2
    internal: true
  - platform: homeassistant
    id: summary_3
    entity_id: sensor.kianevad37_weather_summary_3
    internal: true
  - platform: homeassistant
    id: summary_4
    entity_id: sensor.kianevad37_weather_summary_4
    internal: true
  # ── Forecast high temps ──────────────────────────────────────────────────
  - platform: homeassistant
    id: hi_1
    entity_id: sensor.kianevad37_forecast_temperature_2d
    internal: true
  - platform: homeassistant
    id: hi_2
    entity_id: sensor.kianevad37_forecast_temperature_4d
    internal: true
  - platform: homeassistant
    id: hi_3
    entity_id: sensor.kianevad37_forecast_temperature_6d
    internal: true
  - platform: homeassistant
    id: hi_4
    entity_id: sensor.kianevad37_forecast_temperature_8d
    internal: true
  # ── Forecast low temps ───────────────────────────────────────────────────
  - platform: homeassistant
    id: lo_0
    entity_id: sensor.kianevad37_forecast_temperature_1n
    internal: true
  - platform: homeassistant
    id: lo_1
    entity_id: sensor.kianevad37_forecast_temperature_3n
    internal: true
  - platform: homeassistant
    id: lo_2
    entity_id: sensor.kianevad37_forecast_temperature_5n
    internal: true
  - platform: homeassistant
    id: lo_3
    entity_id: sensor.kianevad37_forecast_temperature_7n
    internal: true
  - platform: homeassistant
    id: lo_4
    entity_id: sensor.kianevad37_forecast_temperature_9n
    internal: true
  # ── Precipitation probability for each day ──────────────────────────────
  - platform: homeassistant
    id: precip_0
    entity_id: sensor.kianevad37_precipitation_probability_0d
    internal: true
  - platform: homeassistant
    id: precip_1
    entity_id: sensor.kianevad37_precipitation_probability_2d
    internal: true
  - platform: homeassistant
    id: precip_2
    entity_id: sensor.kianevad37_precipitation_probability_4d
    internal: true
  - platform: homeassistant
    id: precip_3
    entity_id: sensor.kianevad37_precipitation_probability_6d
    internal: true
  - platform: homeassistant
    id: precip_4
    entity_id: sensor.kianevad37_precipitation_probability_8d
    internal: true

# Track last pressure reading for trend calculation
globals:
  - id: pressure_last
    type: float
    restore_value: yes
    initial_value: '0.0'

display:
  - platform: waveshare_epaper
    id: eink_display
    spi_id: spi_bus
    cs_pin: GPIO5
    dc_pin: GPIO17
    busy_pin: GPIO4
    reset_pin: GPIO16
    model: 7.50in-v2
    # E-ink updates are slow; refresh every 5 minutes to avoid ghosting
    update_interval: 300s
    # Full refresh every update (partial refresh not supported on 7.50in-v2)
    lambda: |-
      it.fill(Color(255, 255, 255));  // white background

      // E-ink palette: black = Color(0,0,0), white = Color(255,255,255)
      const Color BLACK = Color(0, 0, 0);
      const Color WHITE = Color(255, 255, 255);
      const Color LGRAY = Color(180, 180, 180);

      // Display dimensions: 800 x 480
      char buf[64];

      // ── Current conditions header (y=0..99) ──────────────────────────────
      it.filled_rectangle(0, 0, 800, 100, BLACK);

      // Large current temperature (left)
      if (id(weather_temp).has_state()) {
        snprintf(buf, sizeof(buf), "%.1f\xc2\xb0F", atof(id(weather_temp).state.c_str()));
        it.print(20, 50, id(font_xl), WHITE, TextAlign::CENTER_LEFT, buf);
      } else {
        it.print(20, 50, id(font_xl), WHITE, TextAlign::CENTER_LEFT, "--.-\xc2\xb0F");
      }

      // Current weather summary (center, below temp)
      if (id(weather_summary_current).has_state()) {
        it.print(400, 50, id(font_large), WHITE,
                 TextAlign::CENTER, id(weather_summary_current).state.c_str());
      }

      // Humidity + Wind (right side of header)
      if (id(weather_humidity).has_state()) {
        snprintf(buf, sizeof(buf), "%.0f%% RH", atof(id(weather_humidity).state.c_str()));
        it.print(780, 22, id(font_medium), WHITE, TextAlign::TOP_RIGHT, buf);
      }
      {
        std::string spd = id(weather_wind_speed).has_state() ? id(weather_wind_speed).state : "--";
        std::string dir = id(weather_wind_dir).has_state() ? id(weather_wind_dir).state : "--";
        snprintf(buf, sizeof(buf), "%.0f mph %s", atof(spd.c_str()), dir.c_str());
        it.print(780, 52, id(font_medium), WHITE, TextAlign::TOP_RIGHT, buf);
      }

      // ── Section label ──────────────────────────────────────────────────
      it.print(10, 105, id(font_tiny), BLACK, "5-DAY FORECAST");
      it.horizontal_line(0, 118, 800, BLACK);

      // ── Map weather summary text to MDI glyph ─────────────────────────
      auto weather_icon = [](const std::string& s) -> const char* {
        if (s.find("Thunder") != std::string::npos ||
            s.find("Lightning") != std::string::npos)   return "\U000F067E";
        if (s.find("Hail") != std::string::npos)        return "\U000F0592";
        if (s.find("Blizzard") != std::string::npos ||
            s.find("Snow") != std::string::npos ||
            s.find("Sleet") != std::string::npos)       return "\U000F0598";
        if (s.find("Drizzle") != std::string::npos ||
            s.find("Shower") != std::string::npos ||
            s.find("Rain") != std::string::npos)        return "\U000F0596";
        if (s.find("Fog") != std::string::npos ||
            s.find("Mist") != std::string::npos ||
            s.find("Haze") != std::string::npos ||
            s.find("Smoke") != std::string::npos)       return "\U000F0591";
        if (s.find("Wind") != std::string::npos ||
            s.find("Breezy") != std::string::npos)      return "\U000F059D";
        if (s.find("Overcast") != std::string::npos ||
            s.find("Cloudy") != std::string::npos)      return "\U000F0590";
        if (s.find("Partly") != std::string::npos ||
            s.find("Mostly") != std::string::npos ||
            s.find("Scattered") != std::string::npos)   return "\U000F0595";
        if (s.find("Clear") != std::string::npos ||
            s.find("Sunny") != std::string::npos ||
            s.find("Fair") != std::string::npos)        return "\U000F0599";
        return "\U000F0590";  // default: cloudy
      };

      // ── 5-day forecast columns (y=119..390, each 160px wide) ─────────
      // Column centres: 80, 240, 400, 560, 720
      const char* day_labels[5] = {"TODAY", "DAY 2", "DAY 3", "DAY 4", "DAY 5"};
      int cx[5] = {80, 240, 400, 560, 720};

      esphome::text_sensor::TextSensor* summaries[5] = {
        id(summary_0), id(summary_1), id(summary_2), id(summary_3), id(summary_4)
      };
      esphome::text_sensor::TextSensor* hi_sensors[5] = {
        nullptr, id(hi_1), id(hi_2), id(hi_3), id(hi_4)
      };
      esphome::text_sensor::TextSensor* lo_sensors[5] = {
        id(lo_0), id(lo_1), id(lo_2), id(lo_3), id(lo_4)
      };
      esphome::text_sensor::TextSensor* precip_sensors[5] = {
        id(precip_0), id(precip_1), id(precip_2), id(precip_3), id(precip_4)
      };

      // Column separator lines
      for (int i = 1; i < 5; i++) {
        it.vertical_line(i * 160, 119, 271, LGRAY);
      }

      for (int col = 0; col < 5; col++) {
        int x = cx[col];

        // Day label
        it.print(x, 126, id(font_medium), BLACK, TextAlign::TOP_CENTER, day_labels[col]);

        // Weather icon
        if (summaries[col]->has_state()) {
          it.print(x, 155, id(font_icons), BLACK,
                   TextAlign::TOP_CENTER, weather_icon(summaries[col]->state));
        }

        // High temp
        {
          bool have_hi = (col == 0)
            ? id(weather_temp).has_state()
            : (hi_sensors[col] && hi_sensors[col]->has_state());
          if (have_hi) {
            float val = (col == 0)
              ? atof(id(weather_temp).state.c_str())
              : atof(hi_sensors[col]->state.c_str());
            snprintf(buf, sizeof(buf), "H: %.0f\xc2\xb0", val);
            it.print(x, 228, id(font_small), BLACK, TextAlign::TOP_CENTER, buf);
          } else {
            it.print(x, 228, id(font_small), BLACK, TextAlign::TOP_CENTER, "H: --");
          }
        }

        // Low temp
        if (lo_sensors[col] && lo_sensors[col]->has_state()) {
          snprintf(buf, sizeof(buf), "L: %.0f\xc2\xb0",
                   atof(lo_sensors[col]->state.c_str()));
          it.print(x, 258, id(font_small), BLACK, TextAlign::TOP_CENTER, buf);
        } else {
          it.print(x, 258, id(font_small), BLACK, TextAlign::TOP_CENTER, "L: --");
        }

        // Precipitation probability
        if (precip_sensors[col] && precip_sensors[col]->has_state()) {
          snprintf(buf, sizeof(buf), "%.0f%% precip",
                   atof(precip_sensors[col]->state.c_str()));
          it.print(x, 290, id(font_tiny_mid), BLACK, TextAlign::TOP_CENTER, buf);
        } else {
          it.print(x, 290, id(font_tiny_mid), BLACK, TextAlign::TOP_CENTER, "--% precip");
        }
      }

      // ── Bottom ribbon divider ─────────────────────────────────────────
      it.horizontal_line(0, 390, 800, BLACK);

      // ── Bottom ribbon (y=391..480) ────────────────────────────────────
      // Parse sunrise/sunset from ISO UTC timestamps → local 12h format
      auto parse_time = [](const std::string& iso) -> std::string {
        if (iso.length() < 16) return "--:--";
        int hour = atoi(iso.substr(11, 2).c_str());
        int min  = atoi(iso.substr(14, 2).c_str());
        // Convert UTC → Central Time (CST = UTC-6; adjust for DST if needed)
        hour -= 6;
        if (hour < 0) hour += 24;
        bool pm = hour >= 12;
        if (hour > 12) hour -= 12;
        if (hour == 0) hour = 12;
        char result[10];
        snprintf(result, sizeof(result), "%d:%02d %s", hour, min, pm ? "PM" : "AM");
        return std::string(result);
      };

      // Sunrise / Sunset
      if (id(sunrise_time).has_state() && id(sunset_time).has_state()) {
        std::string rise = parse_time(id(sunrise_time).state);
        std::string set  = parse_time(id(sunset_time).state);
        snprintf(buf, sizeof(buf), "Sunrise: %s   Sunset: %s", rise.c_str(), set.c_str());
        it.print(20, 410, id(font_medium), BLACK, buf);
      } else {
        it.print(20, 410, id(font_medium), BLACK, "Sunrise: --:--   Sunset: --:--");
      }

      // Pressure + trend (right side)
      {
        float current = id(pressure).has_state()
          ? atof(id(pressure).state.c_str()) : 0.0;
        float last = id(pressure_last);

        const char* trend = "Steady";
        if (current > 0.0 && last > 0.0) {
          float delta = current - last;
          if (delta > 0.03)       trend = "Rising";
          else if (delta < -0.03) trend = "Falling";
        }
        if (current > 0.0) id(pressure_last) = current;

        if (id(pressure).has_state()) {
          snprintf(buf, sizeof(buf), "%.2f inHg  %s", current, trend);
        } else {
          snprintf(buf, sizeof(buf), "--.- inHg  %s", trend);
        }
        it.print(780, 410, id(font_medium), BLACK, TextAlign::TOP_RIGHT, buf);
      }

      // Last-updated timestamp
      auto now = id(homeassistant_time).now();
      if (now.is_valid()) {
        snprintf(buf, sizeof(buf), "Updated %02d:%02d", now.hour, now.minute);
        it.print(400, 455, id(font_tiny), BLACK, TextAlign::TOP_CENTER, buf);
      }

# Time component (used for last-updated label)
time:
  - platform: homeassistant
    id: homeassistant_time
