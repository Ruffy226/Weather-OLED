esphome:
  name: freenove-display
  friendly_name: Freenove Display
  on_boot:
    then:
      - output.turn_on: display_backlight

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Freenove-Display-Fallback"
    password: !secret fallback_password

captive_portal:

# SPI bus shared by display (and touch if added later)
# Wiring:
#   Display VCC  -> 3.3V
#   Display GND  -> GND
#   Display SCK  -> GPIO12
#   Display MOSI -> GPIO11
#   Display MISO -> GPIO13  (optional for display-only, needed for touch)
#   Display CS   -> GPIO10
#   Display DC   -> GPIO9
#   Display RST  -> GPIO8
#   Display LED  -> GPIO14  (backlight, driven HIGH at boot)

# Backlight driven HIGH at boot
output:
  - platform: gpio
    pin: GPIO14
    id: display_backlight

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  id: spi_bus

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_xl
    size: 56
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 11
  - file: "gfonts://Roboto"
    id: font_tiny_mid
    size: 14

# ── Sensors from Home Assistant ───────────────────────────────────────────────
# All imported as text_sensor; numeric values parsed with atof() in the lambda.
text_sensor:
  - platform: version
    name: "ESPHome Version"
    internal: true

  # ── Current conditions ───────────────────────────────────────────────────
  - platform: homeassistant
    id: weather_temp
    entity_id: sensor.kianevad37_temperature
    internal: true

  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.kianevad37_relative_humidity
    internal: true

  - platform: homeassistant
    id: weather_wind_speed
    entity_id: sensor.kianevad37_wind_speed
    internal: true

  - platform: homeassistant
    id: weather_wind_dir
    entity_id: sensor.kianevad37_wind_direction_cardinal
    internal: true

  # ── 5-day forecast summaries (_0=Fri _1=Sat _2=Sun _3=Mon _4=Tue) ───────
  - platform: homeassistant
    id: summary_0
    entity_id: sensor.kianevad37_weather_summary_0
    internal: true

  - platform: homeassistant
    id: summary_1
    entity_id: sensor.kianevad37_weather_summary_1
    internal: true

  - platform: homeassistant
    id: summary_2
    entity_id: sensor.kianevad37_weather_summary_2
    internal: true

  - platform: homeassistant
    id: summary_3
    entity_id: sensor.kianevad37_weather_summary_3
    internal: true

  - platform: homeassistant
    id: summary_4
    entity_id: sensor.kianevad37_weather_summary_4
    internal: true

  # ── Forecast high temps (_0d=Fri _2d=Sat _4d=Sun _6d=Mon _8d=Tue) ───────
  # Fri high = current temperature (no separate "today high" entity)
  - platform: homeassistant
    id: hi_1
    entity_id: sensor.kianevad37_forecast_temperature_2d
    internal: true

  - platform: homeassistant
    id: hi_2
    entity_id: sensor.kianevad37_forecast_temperature_4d
    internal: true

  - platform: homeassistant
    id: hi_3
    entity_id: sensor.kianevad37_forecast_temperature_6d
    internal: true

  - platform: homeassistant
    id: hi_4
    entity_id: sensor.kianevad37_forecast_temperature_8d
    internal: true

  # ── Forecast low temps / night (_1d=Fri night _3d=Sat _5d=Sun _7d=Mon _9d=Tue) ──
  - platform: homeassistant
    id: lo_0
    entity_id: sensor.kianevad37_forecast_temperature_1d
    internal: true

  - platform: homeassistant
    id: lo_1
    entity_id: sensor.kianevad37_forecast_temperature_3d
    internal: true

  - platform: homeassistant
    id: lo_2
    entity_id: sensor.kianevad37_forecast_temperature_5d
    internal: true

  - platform: homeassistant
    id: lo_3
    entity_id: sensor.kianevad37_forecast_temperature_7d
    internal: true

  - platform: homeassistant
    id: lo_4
    entity_id: sensor.kianevad37_forecast_temperature_9d
    internal: true

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: spi_bus
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    rotation: 90   # landscape 320x240
    invert_colors: false
    lambda: |-
      it.fill(Color(0, 0, 0));

      // ── Current conditions strip (y=0..44) ───────────────────────────────
      it.filled_rectangle(0, 0, 320, 45, Color(0, 40, 80));

      char buf[24];

      // Temperature
      if (id(weather_temp).has_state()) {
        snprintf(buf, sizeof(buf), "%.1f°", atof(id(weather_temp).state.c_str()));
        it.print(5, 14, id(font_small), Color(0, 220, 255), buf);
      } else {
        it.print(5, 14, id(font_small), Color(80, 80, 80), "--.-°");
      }

      // Humidity
      if (id(weather_humidity).has_state()) {
        snprintf(buf, sizeof(buf), "%.0f%% RH", atof(id(weather_humidity).state.c_str()));
        it.print(100, 14, id(font_small), Color(0, 255, 150), buf);
      } else {
        it.print(100, 14, id(font_small), Color(80, 80, 80), "--% RH");
      }

      // Wind speed + direction
      {
        std::string spd = id(weather_wind_speed).has_state() ? id(weather_wind_speed).state : "--";
        std::string dir = id(weather_wind_dir).has_state()   ? id(weather_wind_dir).state   : "--";
        snprintf(buf, sizeof(buf), "%.0fmph %s",
                 atof(spd.c_str()), dir.c_str());
        it.print(200, 14, id(font_small), Color(255, 200, 0), buf);
      }

      // ── Section divider ──────────────────────────────────────────────────
      it.horizontal_line(0, 45, 320, Color(40, 40, 100));

      // ── "5-DAY FORECAST" label ───────────────────────────────────────────
      it.print(5, 49, id(font_tiny), Color(150, 150, 180), "5-DAY FORECAST");
      it.horizontal_line(0, 62, 320, Color(40, 40, 100));

      // ── Column separators (y=62..240) ────────────────────────────────────
      for (int i = 1; i < 5; i++) {
        it.vertical_line(i * 64, 62, 178, Color(30, 30, 60));
      }

      // ── Forecast columns (each 64px wide) ────────────────────────────────
      // Layout per column:
      //   y=67  day name (font_small)
      //   y=92  summary word 1 (font_tiny)
      //   y=105 summary word 2 (font_tiny)
      //   y=152 H: high temp   (font_tiny_mid, orange)
      //   y=170 L: low temp    (font_tiny_mid, blue)
      //
      // Column left edges: 0, 64, 128, 192, 256
      // Day name x (centred 3-char label in 64px ≈ +18px): 18, 82, 146, 210, 274
      // Summary / temp text x (+3px padding):               3, 67, 131, 195, 259

      const char* day_labels[5] = {"FRI", "SAT", "SUN", "MON", "TUE"};
      int day_x[5]  = {18,  82, 146, 210, 274};
      int text_x[5] = { 3,  67, 131, 195, 259};

      // Summary sensor pointers
      esphome::text_sensor::TextSensor* summaries[5] = {
        id(summary_0), id(summary_1), id(summary_2), id(summary_3), id(summary_4)
      };

      // High temp sensors (index 0 = Fri uses current temp, handled separately)
      esphome::text_sensor::TextSensor* hi_sensors[5] = {
        nullptr, id(hi_1), id(hi_2), id(hi_3), id(hi_4)
      };

      // Low temp sensors
      esphome::text_sensor::TextSensor* lo_sensors[5] = {
        id(lo_0), id(lo_1), id(lo_2), id(lo_3), id(lo_4)
      };

      for (int col = 0; col < 5; col++) {
        int dx = day_x[col];
        int tx = text_x[col];

        // Day name
        it.print(dx, 67, id(font_small), Color(255, 255, 255), day_labels[col]);

        // Weather summary — split at spaces into two lines
        if (summaries[col]->has_state()) {
          std::string s = summaries[col]->state;
          size_t sp1 = s.find(' ');
          std::string w1 = (sp1 != std::string::npos) ? s.substr(0, sp1) : s;
          std::string w2 = "";
          if (sp1 != std::string::npos && sp1 + 1 < s.size()) {
            w2 = s.substr(sp1 + 1);
            size_t sp2 = w2.find(' ');
            if (sp2 != std::string::npos) w2 = w2.substr(0, sp2);
          }
          it.print(tx, 92,  id(font_tiny), Color(180, 200, 255), w1.c_str());
          if (!w2.empty()) {
            it.print(tx, 105, id(font_tiny), Color(180, 200, 255), w2.c_str());
          }
        } else {
          it.print(tx, 92, id(font_tiny), Color(80, 80, 80), "---");
        }

        // High temp (col 0 = Friday uses current live temperature)
        if (col == 0) {
          if (id(weather_temp).has_state()) {
            snprintf(buf, sizeof(buf), "H:%.0f°", atof(id(weather_temp).state.c_str()));
            it.print(tx, 152, id(font_tiny_mid), Color(255, 120, 60), buf);
          } else {
            it.print(tx, 152, id(font_tiny_mid), Color(80, 80, 80), "H:--");
          }
        } else {
          if (hi_sensors[col] && hi_sensors[col]->has_state()) {
            snprintf(buf, sizeof(buf), "H:%.0f°", atof(hi_sensors[col]->state.c_str()));
            it.print(tx, 152, id(font_tiny_mid), Color(255, 120, 60), buf);
          } else {
            it.print(tx, 152, id(font_tiny_mid), Color(80, 80, 80), "H:--");
          }
        }

        // Low temp
        if (lo_sensors[col] && lo_sensors[col]->has_state()) {
          snprintf(buf, sizeof(buf), "L:%.0f°", atof(lo_sensors[col]->state.c_str()));
          it.print(tx, 170, id(font_tiny_mid), Color(100, 180, 255), buf);
        } else {
          it.print(tx, 170, id(font_tiny_mid), Color(80, 80, 80), "L:--");
        }
      }
