esphome:
  name: freenove-display
  friendly_name: Freenove Display
  on_boot:
    then:
      - output.turn_on: display_backlight

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Freenove-Display-Fallback"
    password: !secret fallback_password

captive_portal:

# SPI bus shared by display (and touch if added later)
# Wiring:
#   Display VCC  -> 3.3V
#   Display GND  -> GND
#   Display SCK  -> GPIO12
#   Display MOSI -> GPIO11
#   Display MISO -> GPIO13  (optional for display-only, needed for touch)
#   Display CS   -> GPIO10
#   Display DC   -> GPIO9
#   Display RST  -> GPIO8
#   Display LED  -> GPIO14  (backlight, driven HIGH at boot)

# Backlight driven HIGH at boot
output:
  - platform: gpio
    pin: GPIO14
    id: display_backlight

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  id: spi_bus

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_xl
    size: 56

# ── Weather data pulled from Home Assistant ───────────────────────────────────
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home
    internal: true

sensor:
  - platform: homeassistant
    id: weather_temp
    entity_id: sensor.outdoor_temperature   # change to your HA entity
    internal: true
  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.outdoor_humidity      # change to your HA entity
    internal: true

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: spi_bus
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    rotation: 90   # landscape orientation (320 wide x 240 tall)
    invert_colors: false
    lambda: |-
      // Background
      it.fill(Color(0, 0, 0));

      // ── Header bar ──────────────────────────────────────────────────────
      it.filled_rectangle(0, 0, 320, 36, Color(0, 60, 120));
      it.print(10, 6, id(font_large), Color(255, 255, 255), "Weather Station");

      // ── Condition ───────────────────────────────────────────────────────
      std::string cond = id(weather_condition).has_state()
                         ? id(weather_condition).state : "---";
      it.print(10, 48, id(font_small), Color(180, 200, 255), cond.c_str());

      // ── Temperature (large, centre) ──────────────────────────────────
      if (id(weather_temp).has_state()) {
        char buf[12];
        snprintf(buf, sizeof(buf), "%.1f°", id(weather_temp).state);
        it.print(30, 80, id(font_xl), Color(0, 220, 255), buf);
      } else {
        it.print(30, 80, id(font_xl), Color(80, 80, 80), "--.-°");
      }

      // ── Humidity ────────────────────────────────────────────────────────
      if (id(weather_humidity).has_state()) {
        char buf[16];
        snprintf(buf, sizeof(buf), "Humidity: %.0f%%", id(weather_humidity).state);
        it.print(10, 175, id(font_small), Color(0, 255, 150), buf);
      }

      // ── Divider ─────────────────────────────────────────────────────────
      it.horizontal_line(0, 160, 320, Color(40, 40, 60));
