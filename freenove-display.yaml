esphome:
  name: freenove-display
  friendly_name: Freenove Display
  on_boot:
    then:
      - output.turn_on: display_backlight

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Freenove-Display-Fallback"
    password: !secret fallback_password

captive_portal:

# SPI bus shared by display (and touch if added later)
# Wiring:
#   Display VCC  -> 3.3V
#   Display GND  -> GND
#   Display SCK  -> GPIO12
#   Display MOSI -> GPIO11
#   Display MISO -> GPIO13  (optional for display-only, needed for touch)
#   Display CS   -> GPIO10
#   Display DC   -> GPIO9
#   Display RST  -> GPIO8
#   Display LED  -> GPIO14  (backlight, driven HIGH at boot)

# Backlight driven HIGH at boot
output:
  - platform: gpio
    pin: GPIO14
    id: display_backlight

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  id: spi_bus

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_xl
    size: 56
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 11
  - file: "gfonts://Roboto"
    id: font_tiny_mid
    size: 14
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
  # MDI weather icons — only the glyphs we actually use are compiled in
  - file: "materialdesignicons-webfont.ttf"
    id: font_icons
    size: 28
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0598"  # weather-snowy
      - "\U000F0597"  # weather-pouring
      - "\U000F0596"  # weather-rainy
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0594"  # weather-night
      - "\U000F0593"  # weather-lightning
      - "\U000F0592"  # weather-hail
      - "\U000F0591"  # weather-fog
      - "\U000F0590"  # weather-cloudy
      - "\U000F059D"  # weather-windy
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0F35"  # weather-snowy-rainy

# ── Sensors from Home Assistant ───────────────────────────────────────────────
# All imported as text_sensor; numeric values parsed with atof() in the lambda.
text_sensor:
  - platform: version
    name: "ESPHome Version"
    internal: true

  # ── Current conditions ───────────────────────────────────────────────────
  - platform: homeassistant
    id: weather_temp
    entity_id: sensor.kianevad37_temperature
    internal: true

  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.kianevad37_relative_humidity
    internal: true

  - platform: homeassistant
    id: weather_wind_speed
    entity_id: sensor.kianevad37_wind_speed
    internal: true

  - platform: homeassistant
    id: weather_wind_dir
    entity_id: sensor.kianevad37_wind_direction_cardinal
    internal: true

  # ── 5-day forecast summaries (_0=Fri _1=Sat _2=Sun _3=Mon _4=Tue) ───────
  - platform: homeassistant
    id: summary_0
    entity_id: sensor.kianevad37_weather_summary_0
    internal: true

  - platform: homeassistant
    id: summary_1
    entity_id: sensor.kianevad37_weather_summary_1
    internal: true

  - platform: homeassistant
    id: summary_2
    entity_id: sensor.kianevad37_weather_summary_2
    internal: true

  - platform: homeassistant
    id: summary_3
    entity_id: sensor.kianevad37_weather_summary_3
    internal: true

  - platform: homeassistant
    id: summary_4
    entity_id: sensor.kianevad37_weather_summary_4
    internal: true

  # ── Forecast high temps (_0d=Fri _2d=Sat _4d=Sun _6d=Mon _8d=Tue) ───────
  # Fri high = current temperature (no separate "today high" entity)
  - platform: homeassistant
    id: hi_1
    entity_id: sensor.kianevad37_forecast_temperature_2d
    internal: true

  - platform: homeassistant
    id: hi_2
    entity_id: sensor.kianevad37_forecast_temperature_4d
    internal: true

  - platform: homeassistant
    id: hi_3
    entity_id: sensor.kianevad37_forecast_temperature_6d
    internal: true

  - platform: homeassistant
    id: hi_4
    entity_id: sensor.kianevad37_forecast_temperature_8d
    internal: true

  # ── Forecast low temps / night (_1d=Fri night _3d=Sat _5d=Sun _7d=Mon _9d=Tue) ──
  - platform: homeassistant
    id: lo_0
    entity_id: sensor.kianevad37_forecast_temperature_1n
    internal: true

  - platform: homeassistant
    id: lo_1
    entity_id: sensor.kianevad37_forecast_temperature_3n
    internal: true

  - platform: homeassistant
    id: lo_2
    entity_id: sensor.kianevad37_forecast_temperature_5n
    internal: true

  - platform: homeassistant
    id: lo_3
    entity_id: sensor.kianevad37_forecast_temperature_7n
    internal: true

  - platform: homeassistant
    id: lo_4
    entity_id: sensor.kianevad37_forecast_temperature_9n
    internal: true

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: spi_bus
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    rotation: 90   # landscape 320x240
    invert_colors: false
    lambda: |-
      it.fill(Color(0, 0, 0));

      // ── Current conditions strip (y=0..51) ───────────────────────────────
      it.filled_rectangle(0, 0, 320, 52, Color(0, 40, 80));

      char buf[24];

      // Temperature
      if (id(weather_temp).has_state()) {
        snprintf(buf, sizeof(buf), "%.1f°", atof(id(weather_temp).state.c_str()));
        it.print(5, 16, id(font_medium), Color(0, 220, 255), buf);
      } else {
        it.print(5, 16, id(font_medium), Color(80, 80, 80), "--.-°");
      }

      // Humidity
      if (id(weather_humidity).has_state()) {
        snprintf(buf, sizeof(buf), "%.0f%% RH", atof(id(weather_humidity).state.c_str()));
        it.print(105, 16, id(font_medium), Color(0, 255, 150), buf);
      } else {
        it.print(105, 16, id(font_medium), Color(80, 80, 80), "--% RH");
      }

      // Wind speed + direction
      {
        std::string spd = id(weather_wind_speed).has_state() ? id(weather_wind_speed).state : "--";
        std::string dir = id(weather_wind_dir).has_state()   ? id(weather_wind_dir).state   : "--";
        snprintf(buf, sizeof(buf), "%.0fmph %s",
                 atof(spd.c_str()), dir.c_str());
        it.print(210, 16, id(font_medium), Color(255, 200, 0), buf);
      }

      // ── Section divider ──────────────────────────────────────────────────
      it.horizontal_line(0, 52, 320, Color(40, 40, 100));

      // ── "5-DAY FORECAST" label ───────────────────────────────────────────
      it.print(5, 55, id(font_tiny), Color(150, 150, 180), "5-DAY FORECAST");
      it.horizontal_line(0, 67, 320, Color(40, 40, 100));

      // ── Column separators (y=67..240) ────────────────────────────────────
      for (int i = 1; i < 5; i++) {
        it.vertical_line(i * 64, 67, 173, Color(30, 30, 60));
      }

      // ── Forecast columns (each 64px wide, centered) ──────────────────────
      // All text uses TextAlign::TOP_CENTER; x = column centre.
      // Layout per column (y=68..240, 172px):
      //   y=71  day name    (font_small,    TOP_CENTER)
      //   y=91  MDI icon    (font_icons,    TOP_CENTER)
      //   y=133 H: high     (font_tiny_mid, TOP_CENTER, orange)
      //   y=155 L: low      (font_tiny_mid, TOP_CENTER, blue)
      //
      // Column centres: 32, 96, 160, 224, 288

      // Map Wunderground summary text → MDI weather icon glyph
      auto weather_icon = [](const std::string& s) -> const char* {
        if (s.find("Thunder") != std::string::npos ||
            s.find("Lightning") != std::string::npos)   return "\U000F067E"; // lightning-rainy
        if (s.find("Hail") != std::string::npos)        return "\U000F0592"; // hail
        if (s.find("Blizzard") != std::string::npos ||
            s.find("Snow") != std::string::npos ||
            s.find("Sleet") != std::string::npos)       return "\U000F0598"; // snowy
        if (s.find("Drizzle") != std::string::npos ||
            s.find("Shower") != std::string::npos ||
            s.find("Rain") != std::string::npos)        return "\U000F0596"; // rainy
        if (s.find("Fog") != std::string::npos ||
            s.find("Mist") != std::string::npos ||
            s.find("Haze") != std::string::npos ||
            s.find("Smoke") != std::string::npos)       return "\U000F0591"; // fog
        if (s.find("Wind") != std::string::npos ||
            s.find("Breezy") != std::string::npos)      return "\U000F059D"; // windy
        if (s.find("Overcast") != std::string::npos ||
            s.find("Cloudy") != std::string::npos)      return "\U000F0590"; // cloudy
        if (s.find("Partly") != std::string::npos ||
            s.find("Mostly") != std::string::npos ||
            s.find("Scattered") != std::string::npos)   return "\U000F0595"; // partly-cloudy
        if (s.find("Clear") != std::string::npos ||
            s.find("Sunny") != std::string::npos ||
            s.find("Fair") != std::string::npos)        return "\U000F0599"; // sunny
        return "\U000F0590"; // default: cloudy
      };

      const char* day_labels[5] = {"FRI", "SAT", "SUN", "MON", "TUE"};
      int cx[5] = {32, 96, 160, 224, 288};  // column centres

      esphome::text_sensor::TextSensor* summaries[5] = {
        id(summary_0), id(summary_1), id(summary_2), id(summary_3), id(summary_4)
      };
      esphome::text_sensor::TextSensor* hi_sensors[5] = {
        nullptr, id(hi_1), id(hi_2), id(hi_3), id(hi_4)
      };
      esphome::text_sensor::TextSensor* lo_sensors[5] = {
        id(lo_0), id(lo_1), id(lo_2), id(lo_3), id(lo_4)
      };

      for (int col = 0; col < 5; col++) {
        int x = cx[col];

        // Day name — centred
        it.print(x, 71, id(font_small), Color(255, 255, 255),
                 TextAlign::TOP_CENTER, day_labels[col]);

        // Weather icon — centred
        if (summaries[col]->has_state()) {
          it.print(x, 91, id(font_icons), Color(180, 200, 255),
                   TextAlign::TOP_CENTER, weather_icon(summaries[col]->state));
        }

        // High temp — centred (col 0 uses live current temp)
        {
          bool have_hi = (col == 0)
            ? id(weather_temp).has_state()
            : (hi_sensors[col] && hi_sensors[col]->has_state());
          if (have_hi) {
            float val = (col == 0)
              ? atof(id(weather_temp).state.c_str())
              : atof(hi_sensors[col]->state.c_str());
            snprintf(buf, sizeof(buf), "H:%.0f\xc2\xb0", val);
            it.print(x, 133, id(font_tiny_mid), Color(255, 120, 60),
                     TextAlign::TOP_CENTER, buf);
          } else {
            it.print(x, 133, id(font_tiny_mid), Color(80, 80, 80),
                     TextAlign::TOP_CENTER, "H:--");
          }
        }

        // Low temp — centred
        if (lo_sensors[col] && lo_sensors[col]->has_state()) {
          snprintf(buf, sizeof(buf), "L:%.0f\xc2\xb0",
                   atof(lo_sensors[col]->state.c_str()));
          it.print(x, 155, id(font_tiny_mid), Color(100, 180, 255),
                   TextAlign::TOP_CENTER, buf);
        } else {
          it.print(x, 155, id(font_tiny_mid), Color(80, 80, 80),
                   TextAlign::TOP_CENTER, "L:--");
        }
      }
